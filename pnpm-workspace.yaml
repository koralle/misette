packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

catalog:
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-router-devtools": 1.167.2
  "@tanstack/router-plugin": 1.168.48
  js-yaml: 5.4.1

catalogMode: strict

catalogs:
  auth:
    "@better-auth/drizzle-adapter": 1.7.18
    better-auth: 1.7.18
  db:
    drizzle-kit: 0.31.11
    drizzle-orm: 0.45.4
  frontend:
    "@conform-to/react": 1.21.3
    "@conform-to/valibot": 1.21.3
    "@internationalized/date": 3.12.4
    "@tanstack/query-core": 5.106.1
    "@tanstack/react-query": 5.106.1
    "@tanstack/react-query-devtools": 5.106.1
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.7
    lucide-react: 1.69.0
    react: 19.2.8
    react-aria-components: 1.22.1
    react-dom: 19.2.8
    react-scan: 0.5.7
    valibot: 1.5.0
  orpc:
    "@orpc/client": 1.16.1
    "@orpc/tanstack-query": 1.16.1
  githooks:
    lefthook: 2.1.12
  lint:
    "@markuplint/jsx-parser": 4.18.4
    "@markuplint/react-spec": 4.18.4
    knip: 6.44.1
    markuplint: 4.18.5
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2006
    react-doctor: 0.9.22
    ultracite: 7.12.4
  tooling:
    rimraf: 6.1.4
    turbo: 2.11.10
  typescript:
    "@tsconfig/strictest": 2.0.8
    "@types/node": 24.19.2
    typescript: 7.0.2
  vite:
    "@cloudflare/vite-plugin": 1.67.0
    "@pandacss/dev": 1.12.2
    "@vitejs/plugin-react": 6.2.1
    postcss: 8.5.32
    vite: 8.3.6
    vite-plugin-pwa: 1.3.0
    workbox-window: 7.4.1
  workers:
    "@logtape/hono": 2.4.2
    "@logtape/logtape": 2.4.2
    hono: 4.13.16
    wrangler: 4.158.0
  testing:
    "@axe-core/playwright": 4.14.0
    "@lhci/cli": 0.15.1
    "@playwright/test": 1.65.0
    "@vitest/browser-playwright": 5.1.0
    playwright: 1.65.0
    vitest: 5.1.0
    vitest-browser-react: 2.3.0

peerDependencyRules:
  ignoreMissing:
    - workbox-build
    - "@vite-pwa/assets-generator"

saveExact: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - chokidar
  - "@trickfilm400/rollup-plugin-off-main-thread"
