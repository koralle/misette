packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

catalog:
  "@tanstack/react-router": 1.170.39
  "@tanstack/react-router-devtools": 1.167.2
  "@tanstack/router-plugin": 1.168.40
  js-yaml: 5.4.1

catalogMode: strict

catalogs:
  auth:
    "@better-auth/drizzle-adapter": 1.7.6
    better-auth: 1.7.6
  db:
    drizzle-kit: 0.31.11
    drizzle-orm: 0.45.3
  frontend:
    "@conform-to/react": 1.21.1
    "@conform-to/valibot": 1.21.1
    "@internationalized/date": 3.12.4
    "@tanstack/query-core": 5.103.2
    "@tanstack/react-query": 5.103.2
    "@tanstack/react-query-devtools": 5.103.2
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.7
    lucide-react: 1.48.0
    react: 19.2.8
    react-aria-components: 1.21.1
    react-dom: 19.2.8
    react-scan: 0.5.7
    valibot: 1.5.0
  orpc:
    "@orpc/client": 1.15.4
    "@orpc/tanstack-query": 1.15.4
  githooks:
    lefthook: 2.1.14
  lint:
    "@markuplint/jsx-parser": 4.18.3
    "@markuplint/react-spec": 4.18.0
    knip: 6.38.0
    markuplint: 4.18.3
    oxfmt: 0.70.0
    oxlint: 1.85.0
    oxlint-tsgolint: 7.0.2003
    react-doctor: 0.9.14
    ultracite: 7.12.0
  tooling:
    rimraf: 6.1.3
    turbo: 2.11.3
  typescript:
    "@tsconfig/strictest": 2.0.8
    "@types/node": 24.13.6
    typescript: 7.0.2
  vite:
    "@cloudflare/vite-plugin": 1.59.0
    "@pandacss/dev": 1.12.1
    "@vitejs/plugin-react": 6.1.1
    postcss: 8.5.28
    vite: 8.3.1
    vite-plugin-pwa: 1.3.0
    workbox-window: 7.4.1
  workers:
    "@logtape/hono": 2.3.7
    "@logtape/logtape": 2.3.7
    hono: 4.13.9
    wrangler: 4.138.0
  testing:
    "@axe-core/playwright": 4.13.0
    "@lhci/cli": 0.15.1
    "@playwright/test": 1.63.0
    "@vitest/browser-playwright": 5.0.1
    playwright: 1.63.0
    vitest: 5.0.1
    vitest-browser-react: 2.3.0

peerDependencyRules:
  ignoreMissing:
    - workbox-build
    - "@vite-pwa/assets-generator"

saveExact: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - chokidar
  - "@trickfilm400/rollup-plugin-off-main-thread"
