packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

catalogMode: strict

catalogs:
  frontend:
    '@types/react': 19.2.17
    '@types/react-dom': 19.2.3
    react: 19.2.8
    react-dom: 19.2.8
  githooks:
    lefthook: 2.1.12
  lint:
    oxfmt: 0.65.0
    oxlint: 1.75.0
  tooling:
    turbo: 2.10.12
  typescript:
    '@tsconfig/strictest': 2.0.8
    '@types/node': 24.13.3
    typescript: 7.0.2
  vite:
    '@cloudflare/vite-plugin': 1.54.2
    '@vitejs/plugin-react': 6.0.4
    vite: 8.2.0
  workers:
    hono: 4.13.5
    wrangler: 4.127.1

saveExact: true

trustPolicy: no-downgrade
