packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

catalog:
  '@tanstack/react-router': 1.170.32
  '@tanstack/react-router-devtools': 1.167.1
  '@tanstack/router-plugin': 1.168.35
  js-yaml: 5.4.1

catalogMode: strict

catalogs:
  auth:
    '@better-auth/drizzle-adapter': 1.7.2
    better-auth: 1.7.2
  db:
    drizzle-kit: 0.31.10
    drizzle-orm: 0.45.2
  frontend:
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.5
    react: 19.2.8
    react-dom: 19.2.8
  githooks:
    lefthook: 2.1.12
  lint:
    '@markuplint/jsx-parser': 4.18.3
    '@markuplint/react-spec': 4.18.0
    knip: 6.33.0
    markuplint: 4.18.3
    oxfmt: 0.65.0
    oxlint: 1.80.0
    oxlint-tsgolint: 0.25.0
  tooling:
    rimraf: 6.1.3
    turbo: 2.10.12
  typescript:
    '@tsconfig/strictest': 2.0.8
    '@types/node': 24.13.3
    typescript: 7.0.2
  vite:
    '@cloudflare/vite-plugin': 1.54.2
    '@vitejs/plugin-react': 6.1.1
    vite: 8.2.2
  workers:
    hono: 4.13.5
    wrangler: 4.127.1

saveExact: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
