name: Deploy Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/workers/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-workers.yaml'
      - '.github/composite-actions/cache-and-install/**'

permissions:
  contents: read

concurrency:
  group: production-workers
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy workers to Cloudflare Workers
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Build workers
        shell: bash
        run: |
          pnpm exec turbo run build --filter=@misette/workers...

      - name: Deploy workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @misette/workers exec wrangler deploy --minify
